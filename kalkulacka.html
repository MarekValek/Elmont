<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELMONT – Orientační kalkulačka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { elmont: { base: '#070B14', surface: '#0E1626', volt: '#C5F03D' } } } } }</script>
</head>
<body class="bg-elmont-base text-slate-100 flex flex-col min-h-screen">
    <header class="sticky top-0 z-40 bg-elmont-base/90 border-b border-slate-800 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="font-extrabold text-xl text-white">ELMONT</a>
            <nav class="flex flex-wrap gap-4 text-sm font-bold">
                <a href="index.html" class="text-slate-300 hover:text-white">Domů</a>
                <a href="sluzby.html" class="text-slate-300 hover:text-white">Služby</a>
                <a href="kalkulacka.html" class="text-elmont-volt">Kalkulačka</a>
                <a href="realizace.html" class="text-slate-300 hover:text-white">Realizace</a>
                <a href="o-nas.html" class="text-slate-300 hover:text-white">O nás</a>
                <a href="kontakt.html" class="text-slate-300 hover:text-white">Kontakt</a>
            </nav>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-12 flex-grow space-y-8 w-full">
        <div>
            <h1 class="text-3xl sm:text-4xl font-extrabold">Orientační kalkulačka ceny</h1>
            <p class="text-slate-400 mt-2">Zadejte přibližný rozsah prací pro rychlý odhad rozpočtu.</p>
        </div>

        <div class="bg-elmont-surface border border-slate-800 rounded-xl p-6 space-y-5">
            <div>
                <label class="block text-sm font-bold mb-1">Typ objektu</label>
                <select id="objekt" class="w-full bg-elmont-base border border-slate-700 rounded-lg p-3 text-white">
                    <option value="1">Byt (cihla / panel)</option>
                    <option value="1.15">Rodinný dům</option>
                    <option value="1.3">Komerční / průmyslový prostor</option>
                </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold mb-1">Počet zásuvek (ks)</label>
                    <input type="number" id="zasuvky" value="20" min="0" class="w-full bg-elmont-base border border-slate-700 rounded-lg p-3 text-white">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Počet světelných okruhů (ks)</label>
                    <input type="number" id="svetla" value="10" min="0" class="w-full bg-elmont-base border border-slate-700 rounded-lg p-3 text-white">
                </div>
            </div>

            <div class="space-y-2 pt-2">
                <label class="flex items-center gap-2 text-sm cursor-pointer">
                    <input type="checkbox" id="rozvadec" checked class="accent-elmont-volt w-4 h-4">
                    <span>Nový domovní rozvaděč včetně jištění (+ 14 000 Kč)</span>
                </label>
                <label class="flex items-center gap-2 text-sm cursor-pointer">
                    <input type="checkbox" id="revize" checked class="accent-elmont-volt w-4 h-4">
                    <span>Výchozí revizní zpráva (+ 3 500 Kč)</span>
                </label>
            </div>

            <div class="pt-4 border-t border-slate-800 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div>
                    <span class="text-xs text-slate-400 block">Orientační cena bez DPH:</span>
                    <span id="vysledek" class="text-3xl font-extrabold text-elmont-volt">39 500 Kč</span>
                </div>
                <a href="kontakt.html" class="bg-elmont-volt text-elmont-base font-bold px-6 py-3 rounded-lg text-sm">Nezávazně poptat</a>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-800 p-6 text-center text-xs text-slate-500">
        &copy; 2026 ELMONT – Elektroinstalace &amp; Montáže
    </footer>

    <script>
        function spocitat() {
            const koef = parseFloat(document.getElementById('objekt').value);
            const zasuvky = parseInt(document.getElementById('zasuvky').value) || 0;
            const svetla = parseInt(document.getElementById('svetla').value) || 0;
            const rozvadec = document.getElementById('rozvadec').checked ? 14000 : 0;
            const revize = document.getElementById('revize').checked ? 3500 : 0;

            const cena = Math.round(((zasuvky * 750) + (svetla * 700) + rozvadec) * koef + revize);
            document.getElementById('vysledek').textContent = cena.toLocaleString('cs-CZ') + ' Kč';
        }
        document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', spocitat));
        spocitat();
    </script>
</body>
</html>
