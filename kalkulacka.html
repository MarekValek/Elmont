<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELMONT – Kalkulačka ceny online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { elmont: { base: '#070B14', surface: '#0E1626', volt: '#C5F03D' } } } } }
    </script>
</head>
<body class="bg-elmont-base text-slate-100 flex flex-col min-h-screen">
    <header class="sticky top-0 z-40 bg-elmont-base/90 border-b border-slate-800 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="font-heading font-extrabold text-xl text-white">ELMONT</a>
            <nav class="flex gap-4 text-sm font-bold">
                <a href="index.html" class="text-slate-300">Domů</a>
                <a href="sluzby.html" class="text-slate-300">Služby</a>
                <a href="kalkulacka.html" class="text-elmont-volt">Kalkulačka</a>
                <a href="kontakt.html" class="text-slate-300">Kontakt</a>
            </nav>
        </div>
    </header>
    <main class="max-w-4xl mx-auto px-4 py-16 flex-grow">
        <h1 class="text-4xl font-extrabold mb-4">Interaktivní kalkulačka ceny</h1>
        <p class="text-slate-300 mb-8">Zvolte velikost objektu a orientačně spočítejte náklady na elektroinstalaci.</p>
        <div class="bg-elmont-surface p-8 rounded-3xl border border-slate-800 space-y-6">
            <div>
                <label class="block text-sm font-bold mb-2">Plocha objektu: <span id="sqm-val" class="text-elmont-volt">85</span> m²</label>
                <input type="range" id="slider" min="30" max="300" value="85" class="w-full accent-[#C5F03D]">
            </div>
            <div class="p-6 bg-elmont-base rounded-2xl border border-slate-700">
                <div class="text-sm text-slate-400">Orientační odhad ceny:</div>
                <div id="price-res" class="text-3xl font-mono font-bold text-elmont-volt mt-1">98 000 Kč</div>
            </div>
        </div>
    </main>
    <script>
        const slider = document.getElementById('slider');
        const sqmVal = document.getElementById('sqm-val');
        const priceRes = document.getElementById('price-res');
        slider.addEventListener('input', (e) => {
            const val = e.target.value;
            sqmVal.textContent = val;
            priceRes.textContent = (val * 1150).toLocaleString('cs-CZ') + ' Kč';
        });
    </script>
</body>
</html>
