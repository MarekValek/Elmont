<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulačka ceny | ELMONT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3 group">
                <img src="images/logo.png" alt="ELMONT Logo" class="h-12 w-auto object-contain">
                <div class="flex flex-col">
                    <span class="text-xl font-black tracking-wider text-white">ELMONT</span>
                    <span class="text-[10px] tracking-widest text-amber-400 font-semibold uppercase">Elektroinstalace & Montáže</span>
                </div>
            </a>
            <nav class="hidden md:flex items-center gap-8 font-medium">
                <a href="index.html" class="text-slate-300 hover:text-amber-400 transition-colors">Domů</a>
                <a href="sluzby.html" class="text-slate-300 hover:text-amber-400 transition-colors">Služby</a>
                <a href="kalkulacka.html" class="text-amber-400 transition-colors">Kalkulačka ceny</a>
                <a href="kontakt.html" class="text-slate-300 hover:text-amber-400 transition-colors">Kontakt</a>
            </nav>
            <a href="tel:+420777123456" class="hidden lg:flex items-center gap-2 bg-red-600/20 border border-red-500/50 hover:bg-red-600 text-red-400 hover:text-white px-4 py-2 rounded-xl text-sm font-bold transition-all">
                <i class="fa-solid fa-triangle-exclamation animate-pulse"></i>
                <span>Havarijní linka 24/7</span>
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-16">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-black mb-4">Interaktivní <span class="text-amber-400">kalkulačka ceny</span></h1>
            <p class="text-slate-400">Získejte rychlý orientační odhad nákladů na vaše elektroinstalace.</p>
        </div>

        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl space-y-8 shadow-xl">
            <div>
                <label class="block text-sm font-semibold mb-3 text-slate-300">1. Typ objektu:</label>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="setObjekt(450, this)" class="type-btn p-4 rounded-xl border border-amber-500 bg-amber-500/10 text-left font-bold transition-all">Byt / Menší dům</button>
                    <button onclick="setObjekt(750, this)" class="type-btn p-4 rounded-xl border border-slate-800 bg-slate-950 text-left font-bold text-slate-400 transition-all">Rodinný dům / Vila</button>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-3 text-slate-300">2. Orientační plocha (m²):</label>
                <input type="range" id="metry" min="30" max="300" value="100" class="w-full accent-amber-500 bg-slate-950" oninput="vypocet()">
                <div class="text-right text-amber-400 font-bold mt-2"><span id="m2val">100</span> m²</div>
            </div>

            <div class="border-t border-slate-800 pt-6 flex flex-col sm:flex-row items-center justify-between gap-6">
                <div>
                    <span class="text-xs text-slate-400 block">Odhadovaná cena bez DPH:</span>
                    <span id="celkovaCena" class="text-3xl font-black text-white">45 000 Kč</span>
                </div>
                <a href="kontakt.html" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-8 py-4 rounded-xl transition-all shadow-lg shadow-amber-500/20">
                    Odeslat tuto poptávku
                </a>
            </div>
        </div>
    </main>

    <script>
        let sazbaZaM2 = 450;
        function setObjekt(sazba, el) {
            document.querySelectorAll('.type-btn').forEach(b => {
                b.classList.remove('border-amber-500', 'bg-amber-500/10', 'text-white');
                b.classList.add('border-slate-800', 'bg-slate-950', 'text-slate-400');
            });
            el.classList.remove('border-slate-800', 'bg-slate-950', 'text-slate-400');
            el.classList.add('border-amber-500', 'bg-amber-500/10', 'text-white');
            sazbaZaM2 = sazba;
            vypocet();
        }
        function vypocet() {
            let m2 = document.getElementById('metry').value;
            document.getElementById('m2val').innerText = m2;
            let celkem = m2 * sazbaZaM2;
            document.getElementById('celkovaCena').innerText = celkem.toLocaleString() + ' Kč';
        }
    </script>
</body>
</html>
