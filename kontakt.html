<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELMONT – Kontakt a poptávka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { elmont: { base: '#070B14', surface: '#0E1626', volt: '#C5F03D' } } } } }</script>
</head>
<body class="bg-elmont-base text-slate-100 flex flex-col min-h-screen">
    <header class="sticky top-0 z-40 bg-elmont-base/90 border-b border-slate-800 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="font-heading font-extrabold text-xl text-white">ELMONT</a>
            <nav class="flex gap-4 text-sm font-bold">
                <a href="index.html" class="text-slate-300">Domů</a>
                <a href="kontakt.html" class="text-elmont-volt">Kontakt</a>
            </nav>
        </div>
    </header>
    <main class="max-w-3xl mx-auto px-4 py-16 flex-grow">
        <h1 class="text-4xl font-extrabold mb-6">Nezávazná poptávka</h1>
        <form onsubmit="event.preventDefault(); alert('Poptávka byla odeslána!');" class="bg-elmont-surface p-8 rounded-3xl border border-slate-800 space-y-4">
            <div>
                <label class="block text-xs uppercase font-bold text-slate-300 mb-1">Jméno / Firma</label>
                <input type="text" required class="w-full px-4 py-3 rounded-xl bg-elmont-base border border-slate-700 text-white">
            </div>
            <div>
                <label class="block text-xs uppercase font-bold text-slate-300 mb-1">Telefon</label>
                <input type="tel" required class="w-full px-4 py-3 rounded-xl bg-elmont-base border border-slate-700 text-white">
            </div>
            <button type="submit" class="w-full bg-elmont-volt text-elmont-base font-bold py-3.5 rounded-xl">Odeslat poptávku</button>
        </form>
    </main>
</body>
</html>
